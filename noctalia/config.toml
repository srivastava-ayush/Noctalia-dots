[accessibility]
ui_scale = 1.0500000081956387

[bar.default]
background_opacity = 0.57999998703598976
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "session",
    "bar"
]
position = "left"
radius = 17
scale = 1.2500000111758709

[dock]
enabled = true
reserve_space = false
smart_auto_hide = true

[hot_corners]
enabled = true

    [hot_corners.top_left]
    action = "control_center"

    [hot_corners.top_right]
    action = "window_switcher"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."baizhu/asus-gpu-mode"]
gpu-mode-panel_open_near_click = true

[plugins]
enabled = [ "baizhu/asus-gpu-mode", "riversyx/noctaproton-vpn" ]

[shell]
panel_anchor_bar = "default"

    [shell.launcher]
    categories = false
    pinned = [ "zed", "dev.zed.Zed", "helium", "kitty" ]

    [shell.panel]
    open_near_click_launcher = true
    polkit_placement = "attached"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    enabled = true

[theme]
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "kitty", "qt" ]
    community_ids = [ "opencode", "zed", "fastfetch" ]

[wallpaper]
directory = "/home/ayush/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/ayush/Pictures/Wallpapers/finaltouch.jpg"

    [wallpaper.last]
    path = "/home/ayush/Pictures/Wallpapers/finaltouch.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/ayush/Pictures/Wallpapers/finaltouch.jpg"

[widget.bar]
type = "riversyx/noctaproton-vpn:bar"